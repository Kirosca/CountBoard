name: Build and Release CountBoard

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (例如 v1.3.0.3)'
        required: false
        default: 'v1.3.0.3'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: 使用 PyInstaller 打包单文件便携版
        run: |
          pyinstaller --clean CountBoard.spec

      - name: 安装 Inno Setup 编译器
        run: |
          choco install innosetup -y
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl")) {
            Copy-Item -Path "ChineseSimplified.isl" -Destination "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl" -Force -ErrorAction SilentlyContinue
          }

      - name: 使用 Inno Setup 编译 Windows 安装包
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" CountBoard.iss

      - name: 上传构建产物至 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CountBoard-Binaries
          path: |
            dist/CountBoard.exe
            dist_setup/*.exe

      - name: 自动创建 GitHub Release 并发布文件
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            dist/CountBoard.exe
            dist_setup/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
